name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q
      - run: python -m build
      - name: Install built wheel
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',glob.glob('dist/*.whl')[0]])"
      - run: agent-tracecheck scan examples/clean.jsonl --fail-on info
      - run: agent-tracecheck scan examples/broken.jsonl --fail-on none --json reports/report.json --html reports/report.html --sarif reports/report.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
