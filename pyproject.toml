[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tracecheck"
version = "0.2.0"
description = "Lint agent trajectories before they become SFT or RL training data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Agent TraceCheck contributors"}]
keywords = ["agents", "trajectories", "sft", "rl", "data-quality", "lint"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]
dependencies = []

[project.urls]
Repository = "https://github.com/KardeniaPoyu/agent-tracecheck"
Issues = "https://github.com/KardeniaPoyu/agent-tracecheck/issues"
Changelog = "https://github.com/KardeniaPoyu/agent-tracecheck/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.9"]

[project.scripts]
agent-tracecheck = "agent_tracecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F"]
